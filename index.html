  const sellItems = [

    { name: "Software USB", cat: "Heist Gear", price: 3000 },
    { name: "Thermite", cat: "Heist Gear", price: 20000 },
    { name: "USB Pink", cat: "Heist Gear", price: 9000 }
  ];

  buyItems.forEach(i => i.qty = 0);
  sellItems.forEach(i => i.qty = 0);

  const categoriesBuy = ["all", "Jewelry", "Electronics", "Eggs", "Metal Detecting", "Relics & Art", "Miscellaneous"];
  const categoriesSell = ["all", "Heist Gear"];

  const btnModeBuy = document.getElementById("btnModeBuy");
  const btnModeSell = document.getElementById("btnModeSell");
  const staffSelect = document.getElementById("staffSelect");
  const lblPrimary = document.getElementById("lblPrimary");
  const valPrimary = document.getElementById("valPrimary");
  const boxSecondary = document.getElementById("boxSecondary");
  const lblSecondary = document.getElementById("lblSecondary");
  const valSecondary = document.getElementById("valSecondary");
  const categoryContainer = document.getElementById("categoryContainer");
  const tableHeaderRow = document.getElementById("tableHeaderRow");
  const tableBody = document.getElementById("itemsTableBody");
  const searchInput = document.getElementById("searchInput");
  const sortSelect = document.getElementById("sortSelect");
  const resetBtn = document.getElementById("resetBtn");
  const confirmBtn = document.getElementById("confirmBtn");

  function formatCurrency(num) {
    return "$" + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setupCategoryTabs() {
    categoryContainer.innerHTML = "";
    const cats = activeMode === "BUY" ? categoriesBuy : categoriesSell;
    
    cats.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = `tab-btn ${cat === currentCategory ? 'active' : ''}`;
      btn.innerText = cat === "all" ? "All Items" : cat;
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = cat;
        renderTable();
      });
      categoryContainer.appendChild(btn);
    });
  }

  function setupHeaderAndStats() {
    if (activeMode === "BUY") {
      btnModeBuy.className = "mode-btn active-buy";
      btnModeSell.className = "mode-btn";
      lblPrimary.innerText = "Total Buying Price";
      valPrimary.className = "buy-total";
      boxSecondary.style.display = "block";
      lblSecondary.innerText = "Employee Commission (30% Profit)";
      valSecondary.className = "seller-profit";
    } else {
      btnModeSell.className = "mode-btn active-sell";
      btnModeBuy.className = "mode-btn";
      lblPrimary.innerText = "Total Selling Price";
      valPrimary.className = "sell-total";
      boxSecondary.style.display = "none";
    }
  }

  function updateTotals() {
    if (activeMode === "BUY") {
      const totalBuy = buyItems.reduce((acc, i) => acc + (i.qty * i.buy), 0);
      const totalProfit = buyItems.reduce((acc, i) => acc + (i.qty * (i.resell - i.buy)), 0);
      const commission = Math.max(0, totalProfit * 0.30);
      valPrimary.innerText = formatCurrency(totalBuy);
      valSecondary.innerText = formatCurrency(commission);
    } else {
      const totalSell = sellItems.reduce((acc, i) => acc + (i.qty * i.price), 0);
      valPrimary.innerText = formatCurrency(totalSell);
    }
  }

  function getFilteredItems() {
    const list = activeMode === "BUY" ? buyItems : sellItems;
    return list.filter(item => {
      const matchesCat = (currentCategory === "all") || (item.cat === currentCategory);
      const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
      return matchesCat && matchesSearch;
    }).sort((a, b) => {
      const priceA = activeMode === "BUY" ? a.buy : a.price;
      const priceB = activeMode === "BUY" ? b.buy : b.price;
      if (currentSort === "alpha-asc") return a.name.localeCompare(b.name);
      if (currentSort === "alpha-desc") return b.name.localeCompare(a.name);
      if (currentSort === "price-asc") return priceA - priceB;
      if (currentSort === "price-desc") return priceB - priceA;
      return 0;
    });
  }

  function renderTable() {
    tableHeaderRow.innerHTML = "";
    tableBody.innerHTML = "";

    if (activeMode === "BUY") {
      tableHeaderRow.innerHTML = `
        <th>Item Name</th><th>Category</th><th>Buy Price</th>
        <th style="text-align:center;">Quantity</th><th style="text-align:right;">Subtotal</th>
      `;
    } else {
      tableHeaderRow.innerHTML = `
        <th>Item Name</th><th>Category</th><th>Selling Price</th>
        <th style="text-align:center;">Quantity</th><th style="text-align:right;">Subtotal</th>
      `;
    }

    const items = getFilteredItems();

    items.forEach(item => {
      const tr = document.createElement("tr");
      const price = activeMode === "BUY" ? item.buy : item.price;
      const subtotal = item.qty * price;

      tr.innerHTML = `
        <td><span class="item-name">${item.name}</span></td>
        <td><span class="category-badge">${item.cat}</span></td>
        <td><span class="price-tag">${formatCurrency(price)}</span></td>
        <td style="text-align:center;">
          <input type="number" min="0" class="qty-input" value="${item.qty || ''}" placeholder="0">
        </td>
        <td style="text-align:right;"><span class="item-total ${activeMode === "BUY" ? 'buy' : 'sell'}">${formatCurrency(subtotal)}</span></td>
      `;

      const input = tr.querySelector(".qty-input");
      input.addEventListener("input", (e) => {
        item.qty = Math.max(0, parseInt(e.target.value) || 0);
        tr.querySelector(".item-total").innerText = formatCurrency(item.qty * price);
        updateTotals();
      });

      tableBody.appendChild(tr);
    });
  }

  btnModeBuy.addEventListener("click", () => {
    if (activeMode !== "BUY") {
      activeMode = "BUY";
      currentCategory = "all";
      setupHeaderAndStats();
      setupCategoryTabs();
      renderTable();
      updateTotals();
    }
  });

  btnModeSell.addEventListener("click", () => {
    if (activeMode !== "SELL") {
      activeMode = "SELL";
      currentCategory = "all";
      setupHeaderAndStats();
      setupCategoryTabs();
      renderTable();
      updateTotals();
    }
  });

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderTable();
  });

  sortSelect.addEventListener("change", (e) => {
    currentSort = e.target.value;
    renderTable();
  });

  resetBtn.addEventListener("click", () => {
    buyItems.forEach(i => i.qty = 0);
    sellItems.forEach(i => i.qty = 0);
    searchInput.value = "";
    searchQuery = "";
    renderTable();
    updateTotals();
  });

  async function sendToGoogleSheet(staffName, customerName, mode, totalPrice, commissionAmount) {
    if (!GOOGLE_SHEET_URL) return;
    const payload = {
      staff: staffName,
      customer: customerName,
      type: mode === "BUY" ? "Buying" : "Selling",
      total: totalPrice,
      commission: mode === "BUY" ? commissionAmount : 0
    };
    try {
      await fetch(GOOGLE_SHEET_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    } catch (err) {
      console.error("Failed logging transaction:", err);
    }
  }

  confirmBtn.addEventListener("click", async () => {
    const staffName = staffSelect.value;
    const customerName = "Walk-In / Unknown";
    const activeList = activeMode === "BUY" ? buyItems : sellItems;
    const selectedItems = activeList.filter(i => i.qty > 0);

    if (selectedItems.length === 0) {
      alert("Please enter a quantity for at least one item before confirming.");
      return;
    }

    let grandTotal = 0;
    let itemLines = selectedItems.map(i => {
      const p = activeMode === "BUY" ? i.buy : i.price;
      const lineTotal = i.qty * p;
      grandTotal += lineTotal;
      return `• **${i.name}** x${i.qty} — ${formatCurrency(lineTotal)}`;
    }).join("\n");

    const totalProfit = activeMode === "BUY" ? selectedItems.reduce((acc, i) => acc + (i.qty * (i.resell - i.buy)), 0) : 0;
    const commission = Math.max(0, totalProfit * 0.30);

    const fields = [
      { name: "👤 Staff Member", value: staffName, inline: true },
      { name: "💼 Type", value: activeMode === "BUY" ? "Buying" : "Selling", inline: true },
      { name: "💵 Total Price", value: `**${formatCurrency(grandTotal)}**`, inline: false },
      ...(activeMode === "BUY" ? [{ name: "💰 Commission (30% Profit)", value: `**${formatCurrency(commission)}**`, inline: false }] : []),
      { name: "📦 Items", value: itemLines.length > 1024 ? itemLines.substring(0, 1020) + "..." : itemLines, inline: false }
    ];

    const payload = {
      username: "Strawberry Pawnshop Calculator",
      embeds: [{
        title: activeMode === "BUY" ? "🍓 Strawberry Pawn - Buyout" : "⚡ Strawberry Pawn - Sale",
        color: activeMode === "BUY" ? 16711765 : 16711807,
        fields: fields,
        timestamp: new Date().toISOString()
      }]
    };

    try {
      confirmBtn.disabled = true;
      confirmBtn.innerText = "Sending...";

      sendToGoogleSheet(staffName, customerName, activeMode, grandTotal, commission);

      await fetch(CLOUDFLARE_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      alert("Transaction logged successfully!");
      buyItems.forEach(i => i.qty = 0);
      sellItems.forEach(i => i.qty = 0);
      renderTable();
      updateTotals();
    } catch (err) {
      console.error(err);
      alert("Error submitting transaction.");
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.innerText = "Confirm Send";
    }
  });

  setupHeaderAndStats();
  setupCategoryTabs();
  renderTable();
  updateTotals();
</script>
